name: Update marketplace.json from registry

on:
  push:
    branches: [main]
    paths: ['registry.json']
  workflow_dispatch:

jobs:
  update-marketplace:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Regenerate .claude-plugin/marketplace.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const registry = JSON.parse(fs.readFileSync('registry.json', 'utf8'));

            const plugins = (registry.plugins ?? []).map(p => ({
              name:        p.name,
              description: p.description,
              category:    (p.tags?.[0]) || 'productivity',
              source: {
                source: 'url',
                url:    `https://github.com/${p.repo}.git`,
              },
              homepage: `https://github.com/${p.repo}`,
            }));

            const marketplace = JSON.parse(
              fs.readFileSync('.claude-plugin/marketplace.json', 'utf8')
            );
            marketplace.plugins = plugins;

            fs.writeFileSync(
              '.claude-plugin/marketplace.json',
              JSON.stringify(marketplace, null, 2) + '\n'
            );
            console.log(`marketplace.json updated with ${plugins.length} plugin(s).`);

      - name: Commit updated marketplace.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git diff --staged --quiet || git commit -m "chore: sync marketplace.json from registry.json [skip ci]"
          git push
